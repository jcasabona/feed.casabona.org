name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'   # hourly: pick up new videos, episodes and posts
  workflow_dispatch:

permissions:
  contents: write   # commit the feed cache
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A failing feed keeps its cached items and never fails this step.
      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      # Commits made with GITHUB_TOKEN don't trigger another workflow run.
      - name: Commit feed cache
        run: |
          if ! git diff --quiet -- data/feed-cache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feed-cache.json
            git commit -m "chore: update feed cache"
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cross-post new notes/photos once they're live. Skips any platform whose
  # secrets aren't set. Secrets: BSKY_HANDLE, BSKY_APP_PASSWORD,
  # THREADS_USER_ID, THREADS_TOKEN.
  syndicate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/syndicate.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      - name: Commit syndication state
        if: always()
        run: |
          if ! git diff --quiet -- data/syndicated.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/syndicated.json
            git commit -m "chore: update syndication state"
            git push
          fi

  # GitHub disables scheduled workflows in public repos after 60 days without
  # repo activity. If no feed changes for two months, this monthly commit
  # counts as activity and keeps the schedule alive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keepalive commit
        run: |
          last=$(git log -1 --format=%ct -- data/last-run.txt || echo 0)
          now=$(date +%s)
          if [ $((now - last)) -ge 2592000 ]; then
            date -u +%FT%TZ > data/last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/last-run.txt
            git commit -m "chore: keepalive"
            git push
          fi
